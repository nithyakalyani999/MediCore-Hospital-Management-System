<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MediCore - Book Appointment</title>

<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

:root{
--teal-50:#e8f9f4;
--teal-100:#c0f0e0;
--teal-400:#0ec4a1;
--teal-600:#0a9a7e;
--teal-800:#065a49;
--teal-900:#0a3d30;
--border:#d4f0e7;
--muted:#5aaa90;
--bg:#f0f9f6;
--red:#ef4444;
}

body{
font-family:'DM Sans',sans-serif;
background:var(--bg);
color:var(--teal-900);
}

/* ==========================
TOPBAR
========================== */

.topbar{
height:65px;
background:white;
border-bottom:1px solid var(--border);
display:flex;
align-items:center;
justify-content:space-between;
padding:0 30px;
}

.logo{
display:flex;
align-items:center;
gap:10px;
text-decoration:none;
}

.logo-icon{
width:38px;
height:38px;
border-radius:10px;
background:linear-gradient(135deg,var(--teal-400),var(--teal-600));
display:flex;
align-items:center;
justify-content:center;
color:white;
}

.logo-brand{
font-weight:700;
color:var(--teal-600);
}

.logo-sub{
display:block;
font-size:10px;
color:var(--muted);
letter-spacing:1px;
}

.user-info{
display:flex;
align-items:center;
gap:15px;
}

.user-avatar{
width:40px;
height:40px;
border-radius:50%;
background:linear-gradient(135deg,var(--teal-400),var(--teal-600));
display:flex;
align-items:center;
justify-content:center;
font-weight:700;
color:white;
}

.logout-btn{
padding:10px 18px;
border:none;
border-radius:10px;
background:#fee2e2;
color:var(--red);
font-weight:600;
cursor:pointer;
}

/* ==========================
LAYOUT
========================== */

.layout{
display:flex;
height:calc(100vh - 65px);
}

.sidebar{
width:250px;
background:white;
border-right:1px solid var(--border);
padding:25px 15px;
}

.sidebar-title{
font-size:11px;
font-weight:600;
text-transform:uppercase;
color:var(--muted);
margin-bottom:15px;
}

.menu-item{
padding:12px 15px;
border-radius:12px;
margin-bottom:8px;
display:flex;
align-items:center;
gap:10px;
cursor:pointer;
color:var(--muted);
font-weight:500;
transition:.2s;
}

.menu-item:hover{
background:var(--teal-50);
}

.menu-item.active{
background:var(--teal-50);
color:var(--teal-800);
font-weight:600;
}

/* ==========================
CONTENT
========================== */

.content{
flex:1;
padding:35px;
overflow:auto;
}

.page-title{
font-family:'Playfair Display',serif;
font-size:32px;
margin-bottom:10px;
}

.page-sub{
color:var(--muted);
margin-bottom:30px;
}

/* ==========================
DOCTOR CARD
========================== */

.doctor-card{
background:white;
border:1px solid var(--border);
border-radius:20px;
padding:25px;
margin-bottom:25px;
display:flex;
justify-content:space-between;
align-items:center;
flex-wrap:wrap;
gap:20px;
}

.doctor-left{
display:flex;
align-items:center;
gap:15px;
}

.doctor-avatar{
width:70px;
height:70px;
border-radius:50%;
background:linear-gradient(135deg,var(--teal-400),var(--teal-600));
display:flex;
align-items:center;
justify-content:center;
font-size:24px;
font-weight:700;
color:white;
}

.doctor-name{
font-size:20px;
font-weight:700;
margin-bottom:4px;
}

.doctor-spec{
color:var(--muted);
font-size:14px;
margin-bottom:4px;
}

.doctor-exp{
font-size:13px;
color:var(--teal-800);
}

/* ==========================
FORM CARD
========================== */

.form-card{
background:white;
border:1px solid var(--border);
border-radius:20px;
padding:30px;
}

.form-grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:20px;
}

.form-group{
display:flex;
flex-direction:column;
}

.form-group label{
margin-bottom:8px;
font-size:14px;
font-weight:600;
}

.form-group input,
.form-group textarea,
.form-group select{
padding:12px 15px;
border:1.5px solid var(--border);
border-radius:12px;
font-size:14px;
font-family:'DM Sans';
outline:none;
}

.form-group textarea{
resize:none;
height:120px;
}

.form-group input:focus,
.form-group textarea:focus,
.form-group select:focus{
border-color:var(--teal-400);
}

.full-width{
grid-column:1 / span 2;
}

.btn-area{
margin-top:25px;
display:flex;
justify-content:flex-end;
}

.book-btn{
background:linear-gradient(135deg,var(--teal-400),var(--teal-600));
color:white;
border:none;
padding:14px 30px;
border-radius:12px;
font-size:15px;
font-weight:600;
cursor:pointer;
}

.book-btn:hover{
opacity:.9;
}

@media(max-width:768px){

.sidebar{
display:none;
}

.form-grid{
grid-template-columns:1fr;
}

.full-width{
grid-column:auto;
}

}

</style>
</head>

<body>

<header class="topbar">

<a href="#" class="logo">
<div class="logo-icon">
<i class="ti ti-heart-plus"></i>
</div>

<div>
<div class="logo-brand">MediCore</div>
<span class="logo-sub">Hospital</span>
</div>
</a>

<div class="user-info">
<div class="user-avatar">SK</div>

<button class="logout-btn">
<i class="ti ti-logout"></i>
Logout
</button>
</div>

</header>

<div class="layout">

<aside class="sidebar">

<div class="sidebar-title">
Patient Menu
</div>

<div class="menu-item">
<i class="ti ti-user"></i>
My Profile
</div>

<div class="menu-item">
<i class="ti ti-calendar"></i>
My Appointments
</div>

<div class="menu-item active">
<i class="ti ti-calendar-plus"></i>
Book Appointment
</div>

</aside>

<main class="content">

<h1 class="page-title">
Book Appointment
</h1>

<p class="page-sub">
Choose a doctor and schedule your consultation.
</p>

<div class="doctor-card">

<div class="doctor-left">

<div class="doctor-avatar">
DS
</div>

<div>
<div class="doctor-name">
Dr. Sathish
</div>

<div class="doctor-spec">
Cardiologist
</div>

<div class="doctor-exp">
10+ Years Experience
</div>
</div>

</div>

</div>

<div class="form-card">

<form action="AppointmentConfirmation.html" method="post">

<div class="form-grid">

<div class="form-group">
<label>Patient Name</label>
<input type="text" value="Sathish Kumar" readonly>
</div>

<div class="form-group">
<label>Doctor Name</label>
<input type="text" value="Dr. Sathish" readonly>
</div>

<div class="form-group">
<label>Specialization</label>
<input type="text" value="Cardiologist" readonly>
</div>

<div class="form-group">
<label>Consultation Fee</label>
<input type="text" value="₹500" readonly>
</div>

<div class="form-group">
<label>Appointment Date</label>
<input type="date" required>
</div>

<div class="form-group">
<label>Appointment Time</label>
<input type="time" required>
</div>

<div class="form-group full-width">
<label>Symptoms / Reason for Visit</label>
<textarea placeholder="Describe your symptoms or reason for consultation"></textarea>
</div>

</div>

<div class="btn-area">

<button type="submit" class="book-btn">
<i class="ti ti-calendar-check"></i>
Book Appointment
</button>

</div>

</form>

</div>

</main>

</div>

</body>
</html>
