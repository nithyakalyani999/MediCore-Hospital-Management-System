<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MediCore - Add Doctor</title>

<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

:root{
--teal-50:#e8f9f4;
--teal-100:#c0f0e0;
--teal-400:#0ec4a1;
--teal-600:#0a9a7e;
--teal-800:#065a49;
--teal-900:#0a3d30;
--border:#d4f0e7;
--muted:#5aaa90;
--bg:#f0f9f6;
--red:#ef4444;
}

body{
font-family:'DM Sans',sans-serif;
background:var(--bg);
color:var(--teal-900);
}

/* ==========================
TOPBAR
========================== */

.topbar{
height:65px;
background:white;
border-bottom:1px solid var(--border);
display:flex;
align-items:center;
justify-content:space-between;
padding:0 30px;
}

.logo{
display:flex;
align-items:center;
gap:10px;
text-decoration:none;
}

.logo-icon{
width:38px;
height:38px;
background:linear-gradient(135deg,var(--teal-400),var(--teal-600));
border-radius:10px;
display:flex;
align-items:center;
justify-content:center;
color:white;
}

.logo-brand{
font-weight:700;
color:var(--teal-600);
}

.logo-sub{
display:block;
font-size:10px;
letter-spacing:1px;
color:var(--muted);
}

.logout-btn{
padding:10px 18px;
border:none;
border-radius:10px;
background:#fee2e2;
color:var(--red);
cursor:pointer;
font-weight:600;
}

/* ==========================
LAYOUT
========================== */

.layout{
display:flex;
height:calc(100vh - 65px);
}

.sidebar{
width:250px;
background:white;
border-right:1px solid var(--border);
padding:25px 15px;
}

.sidebar-title{
font-size:11px;
text-transform:uppercase;
color:var(--muted);
margin-bottom:15px;
font-weight:600;
}

.menu-item{
padding:12px 15px;
border-radius:12px;
margin-bottom:8px;
cursor:pointer;
display:flex;
align-items:center;
gap:10px;
font-weight:500;
color:var(--muted);
transition:.2s;
}

.menu-item:hover{
background:var(--teal-50);
}

.menu-item.active{
background:var(--teal-50);
color:var(--teal-800);
font-weight:600;
}

/* ==========================
CONTENT
========================== */

.content{
flex:1;
padding:35px;
overflow:auto;
}

.page-title{
font-family:'Playfair Display',serif;
font-size:32px;
margin-bottom:8px;
}

.page-sub{
color:var(--muted);
margin-bottom:30px;
}

/* ==========================
FORM CARD
========================== */

.form-card{
background:white;
border:1px solid var(--border);
border-radius:20px;
padding:30px;
max-width:900px;
}

.form-grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:20px;
}

.form-group{
display:flex;
flex-direction:column;
}

.form-group label{
margin-bottom:8px;
font-size:14px;
font-weight:600;
}

.form-group input,
.form-group select{
height:48px;
border:1.5px solid var(--border);
border-radius:12px;
padding:0 15px;
font-family:'DM Sans';
font-size:14px;
outline:none;
}

.form-group input:focus,
.form-group select:focus{
border-color:var(--teal-400);
}

.full-width{
grid-column:1 / span 2;
}

.btn-area{
margin-top:30px;
display:flex;
justify-content:flex-end;
gap:15px;
}

.reset-btn{
padding:12px 24px;
border:none;
background:#f3f4f6;
border-radius:12px;
cursor:pointer;
font-weight:600;
}

.save-btn{
padding:12px 24px;
border:none;
border-radius:12px;
cursor:pointer;
font-weight:600;
background:linear-gradient(
135deg,
var(--teal-400),
var(--teal-600)
);
color:white;
}

.save-btn:hover{
opacity:.9;
}

@media(max-width:768px){

.sidebar{
display:none;
}

.form-grid{
grid-template-columns:1fr;
}

.full-width{
grid-column:auto;
}

}

</style>
</head>

<body>

<header class="topbar">

<a href="#" class="logo">

<div class="logo-icon">
<i class="ti ti-heart-plus"></i>
</div>

<div>
<div class="logo-brand">MediCore</div>
<span class="logo-sub">Hospital</span>
</div>

</a>

<button class="logout-btn">
<i class="ti ti-logout"></i>
Logout
</button>

</header>

<div class="layout">

<aside class="sidebar">

<div class="sidebar-title">
Admin Menu
</div>

<div class="menu-item">
<i class="ti ti-layout-dashboard"></i>
Dashboard
</div>

<div class="menu-item active">
<i class="ti ti-user-plus"></i>
Add Doctor
</div>

<div class="menu-item">
<i class="ti ti-users"></i>
Doctors
</div>

<div class="menu-item">
<i class="ti ti-calendar"></i>
Appointments
</div>

<div class="menu-item">
<i class="ti ti-user-heart"></i>
Patients
</div>

</aside>

<main class="content">

<h1 class="page-title">
Add Doctor
</h1>

<p class="page-sub">
Register a new doctor into the MediCore Hospital Management System.
</p>

<div class="form-card">

<form>

<div class="form-grid">

<div class="form-group">
<label>Doctor Name</label>
<input type="text" placeholder="Enter doctor name">
</div>

<div class="form-group">
<label>Email Address</label>
<input type="email" placeholder="Enter email">
</div>

<div class="form-group">
<label>Mobile Number</label>
<input type="text" placeholder="Enter mobile number">
</div>

<div class="form-group">
<label>Specialization</label>

<select>
<option>Select Specialization</option>
<option>Cardiologist</option>
<option>Neurologist</option>
<option>Orthopedic</option>
<option>Pediatrician</option>
<option>Dermatologist</option>
<option>Psychiatrist</option>
<option>Radiologist</option>
<option>Gynecologist</option>
</select>

</div>

<div class="form-group">
<label>Experience (Years)</label>
<input type="number" placeholder="Experience">
</div>

<div class="form-group">
<label>Qualification</label>
<input type="text" placeholder="MBBS, MD">
</div>

<div class="form-group">
<label>Password</label>
<input type="password" placeholder="Create password">
</div>

<div class="form-group">
<label>Confirm Password</label>
<input type="password" placeholder="Confirm password">
</div>

<div class="form-group full-width">
<label>Address</label>
<input type="text" placeholder="Doctor address">
</div>

</div>

<div class="btn-area">

<button type="reset" class="reset-btn">
Reset
</button>

<button type="submit" class="save-btn">
<i class="ti ti-device-floppy"></i>
Save Doctor
</button>

</div>

</form>

</div>

</main>

</div>

</body>
</html>
